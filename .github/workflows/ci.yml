name: ci

# 只读门禁：push 到 main、PR、手动触发都跑这一份。
# 发布（打 tag、发 npm、建 Release）在 release.yml 里，两个 workflow 刻意分开，
# 这个文件不持有任何写权限。
#
# 测试自包含：不依赖私有核心，这里跑的就是本地那套全量 npm run check
# （docs/adr/0007）。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# 同一分支上新的推送直接作废上一轮：门禁只关心最新提交。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check (node 24.x)
    # 固定镜像而不是 ubuntu-latest：滚动标签换版时会连带换掉 git/npm 基线，
    # 为了一个插件的门禁去接一次镜像迁移不值得。要换就显式改这一行。
    runs-on: ubuntu-24.04
    # 单测里没有 --test-force-exit，泄漏的句柄会挂住进程而不是报错；用超时兜住。
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          # engines 只支持 24+（node 22 的 --test 会把依赖 AbortSignal.timeout 的
          # 直连用例判成 cancelledByParent），矩阵就这一档。
          node-version: '24.x'
          cache: npm

      # package-lock.json 入库；唯一运行时依赖是钉死版本的飞书 SDK，
      # npm ci 装的是它加类型与打包工具，没有任何私有依赖。
      - name: Install
        run: npm ci

      # typecheck + 单测 + 打包自洽（产物可由源码确定性重建、files 白名单、
      # 依赖白名单、patch 只增不删）。
      - name: Check
        run: npm run check
