name: release

# 版本发布由 main 上一笔改到 package.json 的提交驱动（docs/adr/0007）：
# 先跑门禁，再给发布提交打 tag，然后 npm publish，最后建 GitHub Release 并把同一个
# tgz 挂上去。
#
# 与 dsh-git-panel / dsh-im-wechat 的一处刻意差异：**预发布也发 npm**，但只打频道
# 标签（0.1.0-stage.1 → dist-tag `stage`，0.2.0-rc.1 → `rc`），`latest` 始终留给正式版。
# 首个版本就是 stage 占位版：npm 的可信发布要求包已在 registry 上存在，先用它把名字
# 占住，之后正式版才有 latest 可指。
#
# 正文分两种：正式版的正文来自入库的 docs/releases/v<版本>.md（缺文件直接失败），
# 预发布的正文由 gate 按版本、频道与安装命令生成，不在仓库里留文件。
#
# 每一步都先看状态，所以中途失败可以直接重跑：已有的 tag 会核对版本号而不是跳过，
# npm 上已存在的版本、已存在的 Release 都只补剩下那几步。
#
# 两个 job 是有意的：gate 会装开发依赖并执行它们的代码（npm ci 的脚本、tsc、esbuild、
# 测试），所以它不该拿到能推 tag 或签 OIDC 身份的凭据——那里的供应链一旦被污染，
# 就能用合法来源证明发布一个包。gate 只读、把 tgz 交给 artifact；release 不跑任何
# 依赖代码，只打 tag、发布那个 tgz、写 Release。
on:
  push:
    branches: [main]
    paths: [package.json]
  workflow_dispatch:

# 整个 workflow 的默认权限；release 只为自己放宽。
permissions:
  contents: read

# 一次只发一个版本，也绝不中途取消（npm publish 与 tag、Release 不是事务关系）。
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    # 手动从别的分支触发不许发布：tag 与 Release 必须描述 main 上的提交。
    if: github.ref == 'refs/heads/main'
    steps:
      # 不保留凭据：这个 job 不推送，token 没有理由躺在 .git/config 里陪着依赖代码跑。
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24.x'
          cache: npm
          registry-url: 'https://registry.npmjs.org'

      # 先看这个版本已经走到哪一步，再决定要不要花时间跑门禁。
      - id: state
        name: Release state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          V=$(node -p "require('./package.json').version")
          # 版本号会决定 tag 名与发布命令，只经 env / 文件传给后续步骤，不拼进脚本里。
          if ! printf '%s' "$V" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
            echo "::error::package.json version '$V' is not a release version"
            exit 1
          fi
          # 预发布的频道就是 `-` 之后的第一段：0.1.0-stage.1 → stage。
          case "$V" in
            *-*)
              PRE=true
              CHANNEL="${V#*-}"
              CHANNEL="${CHANNEL%%.*}"
              ;;
            *)
              PRE=false
              CHANNEL=latest
              ;;
          esac
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRE" >> "$GITHUB_OUTPUT"
          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"
          # 随 artifact 交给 release job：那个 job 没有 checkout，不该再猜一遍这些值。
          printf 'V=%s\nPRERELEASE=%s\nCHANNEL=%s\n' "$V" "$PRE" "$CHANNEL" > release-state.env
          REMOTE="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          # 已有 tag 时按「tag 指向的提交里的 version」判断，而不是比 SHA：
          # 之后 main 上动了 package.json 但没升版本的提交也要能重跑并补完剩下的步骤。
          if git ls-remote --exit-code --tags "$REMOTE" "refs/tags/v$V" >/dev/null 2>&1; then
            echo "tag=done" >> "$GITHUB_OUTPUT"
            # 浅克隆没有 tag，只取这一个；显式 refspec 不会建本地 tag，
            # 所以从 FETCH_HEAD 读文件（`:path` 会把 annotated tag 剥到提交）。
            if TV=$(git fetch --quiet --depth=1 "$REMOTE" "refs/tags/v$V" \
                && git show FETCH_HEAD:package.json \
                | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(JSON.parse(s).version))') \
              && [ -n "$TV" ]; then
              if [ "$TV" != "$V" ]; then
                echo "::error::tag v$V points at a commit whose package.json version is '$TV', not '$V'"
                exit 1
              fi
            else
              echo "::error::could not read package.json from tag v$V — refusing to guess whether it was released"
              exit 1
            fi
          fi
          gh release view "v$V" >/dev/null 2>&1 && echo "gh=done" >> "$GITHUB_OUTPUT" || true
          npm view "dsh-im-lark@$V" version >/dev/null 2>&1 && echo "npm=done" >> "$GITHUB_OUTPUT" || true

      # 发布正文：正式版来自 docs/releases/v<版本>.md，随发版提交一起入库、一起评审，
      # 缺文件必须在不可逆的 npm publish 之前失败；预发布（stage / rc）不占
      # docs/releases/，正文由这里按版本、频道与安装命令生成（docs/adr/0007）。
      - id: notes
        name: Release notes
        env:
          V: ${{ steps.state.outputs.version }}
          PRERELEASE: ${{ steps.state.outputs.prerelease }}
          CHANNEL: ${{ steps.state.outputs.channel }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "$PRERELEASE" = "false" ]; then
            FILE="docs/releases/v$V.md"
            if [ ! -f "$FILE" ]; then
              echo "::error::$FILE is missing — write it from .github/RELEASE_TEMPLATE.md and commit it with the version bump"
              exit 1
            fi
            cp "$FILE" release-notes.md
            exit 0
          fi
          # 对比起点是上一个正式版 tag（跳过带 `-` 的 stage / rc）；浅克隆不能读本地
          # tag，从远端列；没有 tag（首个版本）或列不出来时不写对比链接，不猜。
          REMOTE="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          PREV=$(git ls-remote --tags --refs "$REMOTE" 'v*' 2>/dev/null \
            | sed 's#.*refs/tags/##' | grep -v -- '-' | sort -V | tail -1) || true
          if [ -n "$PREV" ]; then
            LINK="[完整变更记录 ${PREV}...v${V}](https://github.com/${GITHUB_REPOSITORY}/compare/${PREV}...v${V})"
            LINK_EN="[Full changelog ${PREV}...v${V}](https://github.com/${GITHUB_REPOSITORY}/compare/${PREV}...v${V})"
          else
            LINK="首个版本。"
            LINK_EN="First release."
          fi
          TGZ="https://github.com/${GITHUB_REPOSITORY}/releases/download/v${V}/dsh-im-lark-${V}.tgz"
          cat > release-notes.md <<EOF
          预发布 \`${V}\`：只发到 npm 的频道标签 \`${CHANNEL}\`，不是正式版——能力与接口仍会变，\`latest\` 留给首个正式版。

          ## 安装

          \`\`\`bash
          # npm 频道标签
          dsh plugin --profile web add dsh-im-lark@${CHANNEL}

          # 同一版本的 Release 附件
          dsh plugin --profile web add ${TGZ}
          \`\`\`

          ## 说明

          - 正文由发布流水线生成：\`docs/releases/\` 只收正式版
          - 能力范围以仓库 README 为准

          ${LINK}

          ---

          ## English

          Prerelease \`${V}\`: published to the npm dist-tag \`${CHANNEL}\` only, not a stable release — capabilities and interfaces may still change, and \`latest\` is reserved for the first stable version.

          ## Install

          \`\`\`bash
          # npm dist-tag
          dsh plugin --profile web add dsh-im-lark@${CHANNEL}

          # The same version as a Release asset
          dsh plugin --profile web add ${TGZ}
          \`\`\`

          ## Notes

          - Generated by the release workflow: \`docs/releases/\` carries stable versions only
          - Capability scope is defined by the repository README

          ${LINK_EN}
          EOF

      - name: Gate
        if: steps.state.outputs.npm != 'done' || steps.state.outputs.tag != 'done' || steps.state.outputs.gh != 'done'
        env:
          V: ${{ steps.state.outputs.version }}
        run: |
          set -euo pipefail
          npm ci
          # 门禁里已经重建过 lib/，打包仍显式再跑一次：产物不依赖测试的副作用。
          npm run check
          npm pack
          mkdir -p pkg && tar -xzf "dsh-im-lark-$V.tgz" -C pkg
          node scripts/assert-pack.mjs pkg/package

      # tgz 跨 job 走 artifact：发布那个 job 既不用 checkout 源码，也不用装依赖。
      # 总是上传：重跑时门禁会被跳过，release 仍需要版本与正文来决定还剩什么没做。
      # overwrite：同一轮重跑会重传同名 artifact，默认的 false 会撞名失败。
      - name: Hand the tarball to the release job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-tarball
          overwrite: true
          path: |
            release-state.env
            release-notes.md
            dsh-im-lark-*.tgz
          if-no-files-found: error
          retention-days: 7

  release:
    needs: gate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    if: github.ref == 'refs/heads/main'
    # 发布路径需要的两样能力，只在这里声明：这个 job 不跑依赖代码。
    permissions:
      contents: write   # 推 tag、建 / 改 Release
      id-token: write   # npm 的可信发布（OIDC）
    steps:
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: release-tarball

      # 只为拿 node 与 npm：这个 job 没有 checkout，也没有 lockfile 可缓存。
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24.x'
          registry-url: 'https://registry.npmjs.org'

      # 可信发布要 npm 11.5.1 以上才会拿 OIDC 换一次性令牌；runner 自带的版本更旧就升一次。
      - name: npm CLI for OIDC
        run: |
          set -euo pipefail
          if printf '11.5.1\n%s\n' "$(npm --version)" | sort -V -C; then
            npm --version
          else
            npm install -g npm@latest --no-fund --no-audit
            npm --version
          fi

      # 门禁已经确认过的事实在这里重新取一遍，所以这个 job 不需要源码：
      # 哪个版本、是不是预发布、发布用哪个频道、还剩哪些步骤。
      - id: state
        name: Release state
        env:
          GH_TOKEN: ${{ github.token }}
          # 没有 checkout 时 gh 只从 GH_REPO 解析仓库（不在 git 目录里它不读 GITHUB_REPOSITORY）。
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # shellcheck disable=SC1091
          . ./release-state.env
          if ! printf '%s' "$V" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
            echo "::error::release state carries no release version ('$V')"
            exit 1
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"
          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"
          # 与 gate 里的判定同源：两个 job 之间 tag 被建出来或被挪走都在这里兜住
          # （gate → release 的 TOCTOU 窗口）。
          if git ls-remote --exit-code --tags "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "refs/tags/v$V" >/dev/null 2>&1; then
            echo "tag=done" >> "$GITHUB_OUTPUT"
            # 没有 checkout，只能走 API 在 tag 的 ref 上读这个文件；读不到就失败，不猜。
            if TV=$(gh api "repos/${GITHUB_REPOSITORY}/contents/package.json?ref=v$V" --jq .content \
                | base64 --decode \
                | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(JSON.parse(s).version))') \
              && [ -n "$TV" ]; then
              if [ "$TV" != "$V" ]; then
                echo "::error::tag v$V points at a commit whose package.json version is '$TV', not '$V'"
                exit 1
              fi
            else
              echo "::error::could not read package.json from tag v$V — refusing to guess whether it was released"
              exit 1
            fi
          fi
          gh release view "v$V" >/dev/null 2>&1 && echo "gh=done" >> "$GITHUB_OUTPUT" || true
          npm view "dsh-im-lark@$V" version >/dev/null 2>&1 && echo "npm=done" >> "$GITHUB_OUTPUT" || true

      - name: Tag
        if: steps.state.outputs.tag != 'done'
        env:
          V: ${{ steps.state.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init --quiet tagname
          cd tagname
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --quiet --depth=1 "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "${GITHUB_SHA}"
          git tag -a "v$V" -m "v$V" FETCH_HEAD
          # token 只出现在这一次 push 的 URL 里，不落盘。
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "refs/tags/v$V"

      # 可信发布（OIDC）：仓库里不配 NPM_TOKEN，npm 用 Actions 的 OIDC 身份换一次性
      # 发布令牌并附上来源证明（provenance）。npmjs.com 那边要把这个仓库的
      # release.yml 配成 dsh-im-lark 的可信发布者（docs/adr/0007）。
      #
      # 预发布只进频道标签：0.1.0-stage.1 发到 dist-tag `stage`，latest 留给正式版。
      - name: Publish to npm
        if: steps.state.outputs.npm != 'done'
        env:
          V: ${{ steps.state.outputs.version }}
          PRERELEASE: ${{ steps.state.outputs.prerelease }}
          CHANNEL: ${{ steps.state.outputs.channel }}
        run: |
          set -euo pipefail
          ARGS=(--provenance --access public)
          if [ "$PRERELEASE" = "true" ]; then
            ARGS+=(--tag "$CHANNEL")
          fi
          npm publish "dsh-im-lark-$V.tgz" "${ARGS[@]}"

      - name: GitHub Release
        if: steps.state.outputs.gh != 'done'
        env:
          GH_TOKEN: ${{ github.token }}
          # 没有 checkout：gh 只从 GH_REPO 解析仓库。
          GH_REPO: ${{ github.repository }}
          V: ${{ steps.state.outputs.version }}
          PRERELEASE: ${{ steps.state.outputs.prerelease }}
        run: |
          set -euo pipefail
          if [ "$PRERELEASE" = "true" ]; then
            CHANNEL_ARGS=(--prerelease)
          else
            CHANNEL_ARGS=(--latest)
          fi
          # 正文以 artifact 里的 release-notes.md 为准（正式版来入库文件，预发布由 gate 生成）；
          # 重跑时用文件内容覆盖页面，手工改网页会被覆盖。
          # 页面已存在时补传一次附件（--clobber）：上一轮可能建了页面却没挂上 tgz。
          if gh release view "v$V" >/dev/null 2>&1; then
            gh release edit "v$V" --title "v$V" --notes-file release-notes.md "${CHANNEL_ARGS[@]}"
            gh release upload "v$V" "dsh-im-lark-$V.tgz" --clobber
          else
            gh release create "v$V" "dsh-im-lark-$V.tgz" \
              --title "v$V" --notes-file release-notes.md --verify-tag "${CHANNEL_ARGS[@]}"
          fi

  # 从非 main 手动触发时不发布任何东西；没有这一段，这一轮会两个 job 都跳过、静默变绿。
  notice:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    if: github.ref != 'refs/heads/main'
    steps:
      - run: echo "::notice::release runs on main only; ref ${GITHUB_REF} triggered no release action"
