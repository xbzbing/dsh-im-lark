<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img" aria-labelledby="heroTitle heroDesc">
  <title id="heroTitle">dsh-im-lark：把飞书 / Lark 接到 DeepSeek Harness</title>
  <desc id="heroDesc">飞书 / Lark 的消息经 dsh-im-lark 进入 DeepSeek Harness；收到打 Get，回答送达后补 DONE。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.5" stop-color="#F5F9FF"/>
      <stop offset="1" stop-color="#E4EDFF"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#4C7DFF" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#4C7DFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3D6BFF" stop-opacity="0"/>
      <stop offset="0.3" stop-color="#3D6BFF"/>
      <stop offset="0.7" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="titleFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0A1830"/>
      <stop offset="1" stop-color="#2B4E8C"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0 H0 V32" fill="none" stroke="#1B3A6B" stroke-opacity="0.055"/>
    </pattern>
    <radialGradient id="gridFade" cx="0.62" cy="0.34" r="0.8">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="0.62" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <mask id="fade"><rect width="1200" height="460" fill="url(#gridFade)"/></mask>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0 L10 5 L0 10 Z" fill="#3D6BFF"/>
    </marker>
    <filter id="panelShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#16305C" flood-opacity="0.10"/>
    </filter>
    <filter id="nodeShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#16305C" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="1200" height="460" fill="url(#bg)"/>
  <rect width="1200" height="460" fill="url(#grid)" mask="url(#fade)"/>
  <ellipse cx="1040" cy="40" rx="440" ry="300" fill="url(#glowA)"/>
  <ellipse cx="130" cy="460" rx="400" ry="260" fill="url(#glowB)"/>
  <rect width="1200" height="3" fill="url(#edge)"/>

  <g font-family="'SF Pro Display','Inter','Helvetica Neue','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">
    <rect x="64" y="74" width="292" height="30" rx="15" fill="#EDF3FF" stroke="#C9DAFF"/>
    <text x="80" y="94" font-size="11.5" letter-spacing="2.4" fill="#3B5BDB">DEEPSEEK HARNESS · PLUGIN</text>

    <text x="62" y="184" font-size="68" font-weight="700" letter-spacing="-1.5" fill="url(#titleFill)">dsh-im-lark</text>
    <text x="64" y="234" font-size="24" font-weight="600" fill="#1C3159">把飞书 / Lark 接到 DeepSeek Harness</text>
    <text x="64" y="264" font-size="16.5" fill="#5C7093">Bridge your Feishu / Lark bot to DeepSeek Harness.</text>

    <rect x="64" y="290" width="520" height="1" fill="#1B3A6B" fill-opacity="0.10"/>

    <rect x="64" y="306" width="94" height="32" rx="16" fill="#FFFFFF" stroke="#DCE6F7"/>
    <text x="111" y="327" font-size="14" text-anchor="middle" fill="#3A4F73">独立会话</text>
    <rect x="170" y="306" width="94" height="32" rx="16" fill="#FFFFFF" stroke="#DCE6F7"/>
    <text x="217" y="327" font-size="14" text-anchor="middle" fill="#3A4F73">接入核心</text>
    <rect x="276" y="306" width="94" height="32" rx="16" fill="#FFFFFF" stroke="#DCE6F7"/>
    <text x="323" y="327" font-size="14" text-anchor="middle" fill="#3A4F73">流式卡片</text>

    <text x="64" y="374" font-size="13.5" fill="#7A8CA8">飞书里的私聊，就是 Web 端的那场对话</text>
  </g>

  <g font-family="'SF Pro Display','Inter','Helvetica Neue','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">
    <rect x="648" y="64" width="488" height="332" rx="22" fill="#FFFFFF" fill-opacity="0.94" stroke="#D6E2F8" filter="url(#panelShadow)"/>
    <text x="672" y="97" font-size="10.5" letter-spacing="2" fill="#8296B4">消息流 · MESSAGE FLOW</text>

    <rect x="668" y="132" width="128" height="120" rx="16" fill="#FFFFFF" stroke="#E2EAF9" filter="url(#nodeShadow)"/>
    <rect x="828" y="132" width="128" height="120" rx="16" fill="#FFFFFF" stroke="#E2EAF9" filter="url(#nodeShadow)"/>
    <rect x="988" y="132" width="128" height="120" rx="16" fill="#FFFFFF" stroke="#E2EAF9" filter="url(#nodeShadow)"/>

    <g transform="translate(732 170)">
      <circle r="22" fill="#3370FF" fill-opacity="0.12"/>
      <path d="M-13 -10 H13 A6 6 0 0 1 19 -4 V4 A6 6 0 0 1 13 10 H-5 L-12 18 L-11 10 H-13 A6 6 0 0 1 -19 4 V-4 A6 6 0 0 1 -13 -10 Z" fill="none" stroke="#2F63E0" stroke-width="1.8" stroke-linejoin="round"/>
    </g>
    <text x="732" y="216" font-size="16" font-weight="600" text-anchor="middle" fill="#10233F">飞书 / Lark</text>
    <text x="732" y="238" font-size="11.5" text-anchor="middle" fill="#7A8CA8">消息 · 卡片 · 表情</text>

    <g transform="translate(892 170)">
      <circle r="22" fill="#06B6D4" fill-opacity="0.12"/>
      <path d="M-13 -5 H10" fill="none" stroke="#0891B2" stroke-width="1.8" stroke-linecap="round"/>
      <path d="M6 -10.5 L11.5 -5 L6 0.5" fill="none" stroke="#0891B2" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M13 6 H-10" fill="none" stroke="#0891B2" stroke-width="1.8" stroke-linecap="round"/>
      <path d="M-6 0.5 L-11.5 6 L-6 11.5" fill="none" stroke="#0891B2" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <text x="892" y="216" font-size="16" font-weight="600" text-anchor="middle" fill="#10233F">IM 桥</text>
    <text x="892" y="238" font-size="11.5" text-anchor="middle" fill="#7A8CA8">桥接 · 双向</text>

    <g transform="translate(1052 170)">
      <circle r="22" fill="#10B981" fill-opacity="0.12"/>
      <rect x="-18" y="-13" width="36" height="26" rx="6" fill="none" stroke="#0E9F6E" stroke-width="1.8"/>
      <path d="M-8 -4 L-2 2 L-8 8" fill="none" stroke="#0E9F6E" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M1 8 H8" fill="none" stroke="#0E9F6E" stroke-width="1.8" stroke-linecap="round"/>
    </g>
    <text x="1052" y="216" font-size="16" font-weight="600" text-anchor="middle" fill="#10233F">Harness</text>
    <text x="1052" y="238" font-size="11.5" text-anchor="middle" fill="#7A8CA8">会话 · 工具</text>

    <line x1="800" y1="192" x2="822" y2="192" stroke="#3D6BFF" stroke-width="1.8" marker-end="url(#arrow)"/>
    <line x1="960" y1="192" x2="982" y2="192" stroke="#3D6BFF" stroke-width="1.8" marker-end="url(#arrow)"/>

    <text x="892" y="298" font-size="13.5" text-anchor="middle" fill="#24395C">收到打 <tspan fill="#1D4ED8" font-weight="600">Get</tspan> · 回答送达补 <tspan fill="#1D4ED8" font-weight="600">DONE</tspan></text>
    <text x="892" y="320" font-size="11.5" text-anchor="middle" fill="#6F82A1">Get on receipt · DONE on delivery</text>
    <rect x="688" y="342" width="408" height="1" fill="#1B3A6B" fill-opacity="0.08"/>
    <text x="892" y="368" font-size="10.5" letter-spacing="1.6" text-anchor="middle" fill="#9AABC4">MY-SUPERAGENT/V1 · STANDALONE</text>
  </g>
</svg>
